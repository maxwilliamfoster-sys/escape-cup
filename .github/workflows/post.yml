name: Schedule Escape Cup matches

on:
  schedule:
    # Every 3 hours: reconcile with Buffer (mark published posts, rewind the
    # bracket if a scheduled video was deleted/rejected) and fill the next slots.
    # Buffer publishes at the exact slot times, so GitHub's cron delays don't
    # move posting times. ~8 runs/day stays well inside Buffer's 250 calls/day.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'schedule = normal run; reset = cancel pending + redraw (only if nothing published); post-now = publish the next pending post immediately and wait for TikTok'
        type: choice
        options: [schedule, reset, post-now]
        default: schedule

concurrency:
  group: escape-cup-post
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # push the media branch + commit tournament_state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev pkg-config

      - run: pip install -r requirements.txt

      - name: Render and schedule
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "reset" ]; then
            python main.py --reset-unpublished
          elif [ "${{ github.event.inputs.mode }}" = "post-now" ]; then
            python main.py --post-now
          else
            python main.py
          fi

      - name: Commit bracket state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tournament_state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
