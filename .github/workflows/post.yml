name: Schedule Escape Cup matches

on:
  schedule:
    # Every 3 hours: reconcile with Buffer (mark published posts, rewind the
    # bracket if a scheduled video was deleted/rejected) and fill the next slots.
    # Buffer publishes at the exact slot times, so GitHub's cron delays don't
    # move posting times. ~8 runs/day stays well inside Buffer's 250 calls/day.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'schedule = normal run; reset = cancel pending + redraw (only if nothing published); post-now = publish the next pending post immediately and wait for TikTok'
        type: choice
        options: [schedule, requeue, reset, post-now]
        default: schedule

concurrency:
  group: escape-cup-post
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # main.py starts renders for up to 35 min, then hosts + schedules
    permissions:
      contents: write      # push the media branch + commit tournament_state.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev pkg-config

      - run: pip install -r requirements.txt

      - name: Render and schedule
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}      # upload gate AI review (optional)
        run: |
          if [ "${{ github.event.inputs.mode }}" = "reset" ]; then
            python main.py --reset-unpublished
          elif [ "${{ github.event.inputs.mode }}" = "requeue" ]; then
            python main.py --requeue
          elif [ "${{ github.event.inputs.mode }}" = "post-now" ]; then
            python main.py --post-now
          else
            python main.py
          fi

      - name: Commit bracket state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tournament_state.json
          if [ -f upload_gate_log.json ]; then git add upload_gate_log.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M)"
          # analytics.yml also pushes to main; a rejected push used to be hidden by
          # "|| true" and the bracket state was lost. Rebase and retry, else fail loudly.
          for i in 1 2 3; do
            if git pull --rebase -q; then
              git push && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
          echo "::error::could not push tournament_state.json"; exit 1
