name: Send sample video

# Renders the next match with this branch's code and sends it to Telegram.
# Never posts, never changes the bracket.
on:
  workflow_dispatch:
    inputs:
      royale:
        description: "Escape Royale heat (16 countries) instead of the next cup match"
        type: boolean
        default: false
      loop_values:
        description: 'Experiment-loop lever values to preview, JSON (e.g. {"pacing": "fast"})'
        required: false
        default: ''

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: System packages
        timeout-minutes: 12          # apt hung on a runner with broken DNS (2026-11-11); this step got the 11 Nov analytics run cancelled
        run: |
          for try in 1 2 3; do
            sudo timeout 150 apt-get update -qq; sudo timeout 240 apt-get install -y -qq ffmpeg libcairo2-dev pkg-config && exit 0
            echo "apt attempt $try failed or timed out"; sleep 20
          done
          exit 1
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://bot-hq.maxwilliamfoster.workers.dev
          APP_EVENTS_TOKEN: ${{ secrets.APP_EVENTS_TOKEN }}
          LOOP_FORCE_VALUES: ${{ inputs.loop_values }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py --sample ${{ inputs.royale && '--royale' || '' }}
