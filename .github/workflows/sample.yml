name: Send sample video

# Renders the next match with this branch's code and sends it to Telegram.
# Never posts, never changes the bracket.
on:
  workflow_dispatch:
    inputs:
      royale:
        description: "Escape Royale heat (16 countries) instead of the next cup match"
        type: boolean
        default: false
      loop_values:
        description: 'Experiment-loop lever values to preview, JSON (e.g. {"pacing": "fast"})'
        required: false
        default: ''

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev pkg-config
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_FORCE_VALUES: ${{ inputs.loop_values }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py --sample ${{ inputs.royale && '--royale' || '' }}
