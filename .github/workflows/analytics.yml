name: Collect analytics

# Read-only: pulls per-post TikTok metrics (views, likes, comments, shares,
# average watch time) from Buffer into analytics.json, plus the public follower
# count, so the weekly review can judge posts at the same age (72h).
on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

concurrency:
  group: escape-cup-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: System packages
        timeout-minutes: 12          # apt hung on a runner with broken DNS (2026-11-11); this step got the 11 Nov analytics run cancelled
        run: |
          for try in 1 2 3; do
            sudo timeout 150 apt-get update -qq; sudo timeout 240 apt-get install -y -qq libcairo2-dev pkg-config && exit 0
            echo "apt attempt $try failed or timed out"; sleep 20
          done
          exit 1
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # analytics.collect now looks the channel up (buffer_client.find_channel); pin it
          # to the same channel post.yml posts to, as the Buffer account holds 2 TikToks
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://bot-hq.maxwilliamfoster.workers.dev
          APP_EVENTS_TOKEN: ${{ secrets.APP_EVENTS_TOKEN }}
        run: python analytics.py
      # Nightly experiment loop (growth-lab): judge / promote / revert / start one
      # test from levers.json. Writes only experiments.json, loop_config.json and
      # loop_summary.json; never fails the job. Pause: "paused": true in loop_config.json.
      - name: Experiment loop
        run: python loop_nightly.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics.json
          for f in experiments.json loop_config.json loop_summary.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "analytics: $(date -u +%Y-%m-%dT%H:%M)"
          # post.yml also pushes to main: rebase and retry, else fail loudly
          # (a rejected push used to be hidden by "|| true" and the day's data lost).
          for i in 1 2 3; do
            if git pull --rebase --autostash -q; then
              git push && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 5))
          done
          echo "::error::could not push analytics state after 3 tries"; exit 1
