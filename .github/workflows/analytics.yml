name: Collect analytics

# Read-only: pulls per-post TikTok metrics (views, likes, comments, shares,
# average watch time) from Buffer into analytics.json, plus the public follower
# count, so the weekly review can judge posts at the same age (72h).
on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

concurrency:
  group: escape-cup-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analytics.py
      # Nightly experiment loop (growth-lab): judge / promote / revert / start one
      # test from levers.json. Writes only experiments.json, loop_config.json and
      # loop_summary.json; never fails the job. Pause: "paused": true in loop_config.json.
      - name: Experiment loop
        run: python loop_nightly.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics.json
          for f in experiments.json loop_config.json loop_summary.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || git commit -m "analytics: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push || true
